<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — UniHive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="theme-color" content="#1B4332">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F9FAFB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #E5E7EB;
      padding: 40px;
      max-width: 420px;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
      text-decoration: none;
    }
    .logo svg { width: 32px; height: 32px; }
    .logo-text { font-size: 18px; font-weight: 700; }
    .logo-text span:first-child { color: #1B4332; }
    .logo-text span:last-child { color: #F59E0B; }
    h1 { font-size: 22px; font-weight: 700; color: #1B4332; margin-bottom: 6px; text-align: center; }
    .sub { font-size: 14px; color: #6B7280; text-align: center; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #E5E7EB;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #1B4332; }
    .field-error {
      display: block;
      font-size: 12px;
      color: #DC2626;
      margin-top: 6px;
      min-height: 16px;
    }
    .btn-login {
      width: 100%;
      padding: 13px 24px;
      background: #F59E0B;
      color: #1B4332;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-error {
      background: rgba(220,38,38,0.06);
      border: 1px solid rgba(220,38,38,0.2);
      color: #DC2626;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
    }
    .footer-link {
      text-align: center;
      font-size: 13px;
      color: #6B7280;
      margin-top: 20px;
    }
    .footer-link a { color: #1B4332; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

  <a href="index.html" class="logo">
    <svg viewBox="0 0 38 38" fill="none">
      <rect width="38" height="38" rx="9" fill="#1B4332"/>
      <polygon points="19,8 27,12.5 27,21.5 19,26 11,21.5 11,12.5" fill="#F59E0B"/>
      <rect x="10" y="5" width="18" height="4" rx="1.5" fill="white"/>
      <rect x="15" y="2" width="8" height="5" rx="1.5" fill="#F59E0B"/>
      <circle cx="19" cy="17" r="3" fill="#1B4332"/>
    </svg>
    <span class="logo-text"><span>Uni</span><span>Hive</span></span>
  </a>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to view your dashboard and alerts.</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="e.g. ibrahim@gmail.com" autocomplete="email" />
        <span class="field-error" id="emailError"></span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />
        <span class="field-error" id="passwordError"></span>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Log in</button>
    </form>

    <p class="footer-link">Don't have an account? <a href="onboard.html">Sign up</a></p>
  </div>

<script>
  function showFieldError(id, msg) {
    const el = document.getElementById(id);
    if (el) el.textContent = msg;
  }

  function clearErrors() {
    document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
    document.getElementById('formError').style.display = 'none';
  }

  function showFormError(msg) {
    const el = document.getElementById('formError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function handleLogin(e) {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    let valid = true;
    if (!email) { showFieldError('emailError', 'Enter your email address'); valid = false; }
    if (!password) { showFieldError('passwordError', 'Enter your password'); valid = false; }
    if (!valid) return;

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const res = await fetch('https://unihive-backend-production.up.railway.app/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('unihive_token', data.token);
        localStorage.setItem('unihive_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } else {
        showFormError(data.error || 'Login failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    } catch (err) {
      showFormError('Could not reach the server. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  }
</script>
</body>
</html>
